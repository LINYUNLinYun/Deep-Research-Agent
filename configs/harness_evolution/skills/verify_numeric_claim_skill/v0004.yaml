description: Conservative deterministic verification of numeric, monetary, percentage
  and date claims.
claim_types:
- number
- percentage
- currency
- date
- fiscal_year
primitives:
- detect_numeric_claim
- normalize_number
- normalize_percentage
- normalize_currency_unit
- normalize_date_or_fiscal_year
- rank_primary_sources
- locate_source_span
- align_entity_value
- compare_value_unit_date
- resolve_source_conflict
- classify_supported_contradicted_unknown
parameters:
